name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  Configuration: Release

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDKs (net8.0 + net10.0)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: SDK information
        run: dotnet --info

      - name: Restore
        run: |
          dotnet restore src/HanziLookup/HanziLookup.csproj
          dotnet restore src/HanziLookup.Avalonia/HanziLookup.Avalonia.csproj
          dotnet restore src/HanziLookup.Demo/HanziLookup.Demo.csproj
          dotnet restore tests/HanziLookup.Tests/HanziLookup.Tests.csproj
          dotnet restore tests/HanziLookup.Demo.Tests/HanziLookup.Demo.Tests.csproj

      - name: Build the recognizer library (net8.0 + net10.0)
        run: dotnet build src/HanziLookup/HanziLookup.csproj -c ${{ env.Configuration }} --no-restore

      - name: Build the Avalonia control library (net8.0 + net10.0)
        run: dotnet build src/HanziLookup.Avalonia/HanziLookup.Avalonia.csproj -c ${{ env.Configuration }} --no-restore

      - name: Build the demo application
        run: dotnet build src/HanziLookup.Demo/HanziLookup.Demo.csproj -c ${{ env.Configuration }} --no-restore

      - name: Test
        run: >
          dotnet test tests/HanziLookup.Tests/HanziLookup.Tests.csproj -c ${{ env.Configuration }}
          --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Test the demo application (headless Avalonia)
        run: >
          dotnet test tests/HanziLookup.Demo.Tests/HanziLookup.Demo.Tests.csproj -c ${{ env.Configuration }}
          --no-restore
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=demo-test-results.trx"
          --results-directory TestResults

      - name: Build the demo application against net8.0
        # no --no-restore: the assets file has to be regenerated for the net8.0 target framework
        run: >
          dotnet build src/HanziLookup.Demo/HanziLookup.Demo.csproj -c ${{ env.Configuration }}
          -p:HanziLookupAppTargetFramework=net8.0

      - name: Report failing tests as annotations
        # The test log lives on blob storage, which is not reachable from every environment, so
        # mirror the failures into check-run annotations, which are readable through the REST API.
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 tools/ci/report-test-failures.py TestResults

      - name: Pack the NuGet packages
        run: |
          dotnet pack src/HanziLookup/HanziLookup.csproj -c ${{ env.Configuration }} --no-build -o artifacts
          dotnet pack src/HanziLookup.Avalonia/HanziLookup.Avalonia.csproj -c ${{ env.Configuration }} --no-build -o artifacts

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts
          if-no-files-found: ignore

  native-aot:
    name: native AOT
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # A single framework is enough: the smoke test and the demo both target net10.0.
          dotnet-version: 10.0.x

      - name: Install the native AOT prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang zlib1g-dev xvfb

      - name: Publish the recognizer self test as a native binary
        run: >
          dotnet publish tools/aot-smoke/AotSmoke.csproj -c ${{ env.Configuration }}
          -r linux-x64 -o artifacts/aot-smoke

      - name: Run the native recognizer self test
        run: |
          file artifacts/aot-smoke/HanziLookup.AotSmoke
          ls -l artifacts/aot-smoke/HanziLookup.AotSmoke
          ./artifacts/aot-smoke/HanziLookup.AotSmoke

      - name: Publish the demo application as a native binary
        run: >
          dotnet publish src/HanziLookup.Demo/HanziLookup.Demo.csproj -c ${{ env.Configuration }}
          -r linux-x64 -o artifacts/aot-demo

      - name: Run the native demo window (Xvfb)
        # The demo checks itself: it shows the window, draws a stroke through the input canvas,
        # verifies the candidate list and exits with a non-zero code if anything is wrong.
        run: timeout 180 xvfb-run -a ./artifacts/aot-demo/HanziLookup.Demo --self-check-ui
